<div class="layout-column align-items-center mt-50">
  <section class="layout-row align-items-center justify-content-center">
    <input
      type="text"
      class="large"
      data-test-id="app-input"
      [(ngModel)]="inputValue"
      placeholder="Enter text"
    />
    <button
      class="btn green"
      data-test-id="append-button"
      (click)="appendText()"
    >
      Append
    </button>
    <button
      class="btn red"
      data-test-id="undo-button"
      (click)="undoLast()"
    >
      Undo
    </button>
  </section>
  <section class="layout-row align-items-center justify-content-center">
    <div class="card">
      <div class="card-text" data-test-id="output-field">
        {{ outputText }}
      </div>
    </div>
  </section>
</div>
