<div class="thumbnails-container">
  <div
    *ngFor="let catalog of items; let idx = index"
    class="thumbnail"
    [ngClass]="{ 'thumbnail-selected': idx === currentIndex }"
    [attr.data-test-id]="'thumb-button-' + idx"
    [ngStyle]="{ 'background-image': 'url(' + catalog.thumb + ')' }"
    (click)="selectedCatalog.emit(idx)"
  ></div>
</div>
